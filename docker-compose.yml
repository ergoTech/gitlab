# GitLab CE Docker Compose Setup
# ARM64 compatible (Apple Silicon, Raspberry Pi, etc.)
# 
# Usage:
#   1. cp .env.sample .env
#   2. Edit .env with your settings
#   3. docker compose up -d
#   4. Wait ~5 minutes for GitLab to initialize
#   5. Run ./scripts/register-runner.sh to register the runner

services:
  # ===========================================
  # GITLAB CE SERVER
  # ===========================================
  gitlab:
    image: gitlab/gitlab-ce:18.6.1-ce.0
    container_name: gitlab
    # Docker registers this name in the embedded DNS for the WHOLE network, not
    # just in this container's /etc/hosts - every container on gitlab-network
    # resolves it to this one. Defaults to GITLAB_HOSTNAME, which is what makes
    # a plain-http local setup work: register-runner.sh puts CI job containers
    # on gitlab-network and they clone from external_url, so gitlab.local has to
    # resolve to this container on port 80, and it does. (A runner configured
    # with network_per_build and an explicit clone_url - as the production one
    # is - does not depend on this either way.)
    #
    # Override it with an internal name when GITLAB_EXTERNAL_SCHEME is https:
    # the clone URL is then https://<public name>, that name still resolves to
    # this container inside the network, and nothing here listens on 443
    # (nginx['listen_port'] = 80 below). See GITLAB_CONTAINER_HOSTNAME.
    hostname: ${GITLAB_CONTAINER_HOSTNAME:-${GITLAB_HOSTNAME:-gitlab.local}}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      GITLAB_OMNIBUS_CONFIG: |
        # Scheme is a knob because TLS is terminated by a proxy in front, not
        # here. Two directives below keep GitLab's own nginx out of the way and
        # they are not interchangeable: listen_port picks the port (80, so not
        # 443), and listen_https = false decides whether that port speaks TLS.
        # Drop the second with the scheme at https and `@https` flips for the
        # whole server block: nginx renders `listen *:80 ssl;` and wants a
        # certificate at /etc/gitlab/ssl/<hostname>.crt, which does not exist
        # here because the proxy holds the certificate. nginx then refuses to
        # start at all, so the symptom is a container that never turns healthy,
        # not an error page.
        #
        # Let's Encrypt stays off through two independent guards, and only one
        # of them is obvious. Omnibus auto-enables it when letsencrypt['enable']
        # is nil AND the scheme is https AND listen_https is not false, so both
        # the explicit letsencrypt['enable'] = false and the listen_https = false
        # below suppress it on their own. Remove one and Let's Encrypt still
        # stays off (though removing listen_https costs you nginx, above);
        # remove both and it tries to issue a certificate for the public name on
        # a host that never asked for one. Setting this to https changes real
        # behaviour, not just generated links - read GITLAB_EXTERNAL_SCHEME in
        # .env.sample before you touch it.
        external_url '${GITLAB_EXTERNAL_SCHEME:-http}://${GITLAB_HOSTNAME:-gitlab.local}'

        # SSH settings
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-22}
        gitlab_rails['gitlab_ssh_host'] = '${GITLAB_SSH_HOST:-${GITLAB_HOSTNAME:-gitlab.local}}'

        # Initial root password
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-ChangeMe123!}'

        # Container Registry
        # For Cloudflare setup: use separate subdomain without port (e.g., https://registry.example.com)
        # For local setup: use hostname with port (e.g., http://gitlab.local:5050)
        registry_external_url '${GITLAB_REGISTRY_EXTERNAL_URL:-http://${GITLAB_HOSTNAME:-gitlab.local}:${GITLAB_REGISTRY_PORT:-5050}}'
        gitlab_rails['registry_enabled'] = true
        registry['enable'] = true
        registry_nginx['enable'] = true
        registry_nginx['listen_port'] = ${GITLAB_REGISTRY_PORT:-5050}
        registry_nginx['listen_https'] = false
        
        # Package Registry (npm, pypi, maven, etc.) - enabled by default
        gitlab_rails['packages_enabled'] = true

        # SMTP / Email configuration (MailerSend)
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "${SMTP_ADDRESS:-smtp.mailersend.net}"
        gitlab_rails['smtp_port'] = ${SMTP_PORT:-587}
        gitlab_rails['smtp_user_name'] = "${SMTP_USERNAME}"
        gitlab_rails['smtp_password'] = "${SMTP_PASSWORD}"
        gitlab_rails['smtp_domain'] = "${SMTP_DOMAIN:-mailersend.net}"
        gitlab_rails['smtp_authentication'] = "plain"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'peer'

        # Email sender settings
        gitlab_rails['gitlab_email_enabled'] = true
        gitlab_rails['gitlab_email_from'] = "${GITLAB_EMAIL_FROM}"
        gitlab_rails['gitlab_email_display_name'] = "${GITLAB_EMAIL_DISPLAY_NAME:-GitLab}"
        gitlab_rails['gitlab_email_reply_to'] = "${GITLAB_EMAIL_REPLY_TO}"
        gitlab_rails['gitlab_email_subject_suffix'] = "${GITLAB_EMAIL_SUBJECT_SUFFIX:-}"

        # Disable unnecessary services to save resources
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        pgbouncer_exporter['enable'] = false
        gitlab_exporter['enable'] = false

        # Disable GitLab Pages (enable if needed)
        pages_external_url nil
        gitlab_pages['enable'] = false
        
        # Puma settings (reduce memory usage)
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        
        # Sidekiq settings
        sidekiq['max_concurrency'] = 10
        
        # PostgreSQL settings
        postgresql['shared_buffers'] = "256MB"
        
        # Nginx settings
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        
        # Disable Let's Encrypt
        letsencrypt['enable'] = false
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    ports:
      - "${GITLAB_HTTP_PORT:-8080}:80"
      # Both sides move together: GITLAB_REGISTRY_PORT also sets
      # registry_nginx['listen_port'] above, so publishing it to a fixed 5050
      # inside would point the host at a port nothing listens on.
      - "${GITLAB_REGISTRY_PORT:-5050}:${GITLAB_REGISTRY_PORT:-5050}"
      - "${GITLAB_SSH_EXTERNAL_PORT:-2222}:22"
    volumes:
      - ./data/gitlab/config:/etc/gitlab
      - ./data/gitlab/logs:/var/log/gitlab
      - ./data/gitlab/data:/var/opt/gitlab
    shm_size: '256m'
    networks:
      - gitlab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # GitLab needs time to initialize

  # ===========================================
  # GITLAB RUNNER
  # ===========================================
  # Uses Docker Socket Mounting approach for local development
  # This allows jobs to use the host's Docker daemon directly
  # For production, consider using Docker-in-Docker per job instead
  gitlab-runner:
    image: gitlab/gitlab-runner:alpine
    container_name: gitlab-runner
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
    volumes:
      - ./data/runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock  # Mount host Docker socket
    networks:
      - gitlab-network
    depends_on:
      gitlab:
        condition: service_healthy

# ===========================================
# NETWORKS
# ===========================================
networks:
  gitlab-network:
    driver: bridge
    name: gitlab-network

# ===========================================
# VOLUMES
# ===========================================
# No volumes needed for socket mounting approach
